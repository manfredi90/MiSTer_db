# Every hour: rebuild db.json from the latest release of each core in cores.json
# and commit it when it changed.
name: db

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  push:
    paths: [cores.json, make_db.py]

permissions:
  contents: write
  actions: write   # keepalive below

concurrency:
  group: db

jobs:
  db:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # GitHub turns off the schedule of a public repo after 60 days without activity:
      # enabling the workflow again restarts the count
      - name: Keepalive
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/db.yml/enable" || true

      - uses: actions/checkout@v4

      - run: python3 make_db.py

      - name: Commit
        run: |
          git diff --quiet db.json 2> /dev/null && [ -z "$(git status --porcelain db.json)" ] && exit 0
          git config user.name manfredi90
          git config user.email manfredi90@gmail.com
          git add db.json
          git commit -m "db: $(python3 -c 'import json; print(", ".join(sorted(p.split("/")[-1] for p in json.load(open("db.json"))["files"])))')"
          git push
